<style>
  :root {
    --bg: #F1F3F6;
    --card: #FFFFFF;
    --ink: #10202E;
    --sub: #6C7A88;
    --line: #E4E8EC;
    --owed: #A8365F;
    --owed-soft: #FBEFF3;
    --done: #0E7A6E;
    --done-soft: #E4F2F0;
    --r: 16px;
    --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0F172A;
    --card: #1E293B;
    --ink: #F8FAFC;
    --sub: #94A3B8;
    --line: #334155;
    --owed: #F43F5E;
    --owed-soft: #3B1828;
    --done: #10B981;
    --done-soft: #064E3B;
  }
  [data-font="rounded"] {
    --font: "M PLUS Rounded 1c", sans-serif;
  }
  [data-font="mincho"] {
    --font: "Shippori Mincho", "Yu Mincho", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font);
    font-variant-numeric: tabular-nums;
    font-size: 15px; line-height: 1.6;
    /* 画面の高さに固定し、中身だけをスクロールさせる（下のバーを動かさないため） */
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  main {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 14px calc(90px + env(safe-area-inset-bottom, 0px)); max-width: 560px; width: 100%; margin: 0 auto;
  }
  h2 { font-size: 13px; color: var(--sub); font-weight: 500; margin: 22px 4px 10px; }

  /* 上部の未回収サマリー */
  .summary-card {
    background: #FFFFFF; border: 1px solid var(--line); border-radius: 20px;
    padding: 18px 20px; box-shadow: 0 4px 16px rgba(16, 32, 46, 0.04); margin-bottom: 14px;
  }
  .summary-card .head { display: flex; justify-content: space-between; align-items: center; }
  .summary-card .title { font-size: 13px; font-weight: 700; color: var(--sub); }
  .summary-card .amt { font-size: 34px; font-weight: 900; letter-spacing: -0.02em; color: var(--owed); line-height: 1.15; margin: 4px 0 2px; }
  .summary-card .sub-stats { display: flex; gap: 12px; font-size: 12px; color: var(--sub); margin-top: 4px; }

  /* カレンダー */
  .cal-card {
    background: #FFFFFF; border: 1px solid var(--line); border-radius: 20px;
    padding: 16px 8px 14px; box-shadow: 0 4px 16px rgba(16, 32, 46, 0.04);
  }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 8px; }
  .cal-title { font-size: 16px; font-weight: 700; color: var(--ink); }
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .cal-nav-btn {
    border: 1px solid var(--line); background: #FAFBFC; border-radius: 9px;
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 13px; color: var(--ink); font-weight: 700;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; width: 100%; justify-items: center; align-items: center; }
  .cal-dow { font-size: 11px; font-weight: 700; color: var(--sub); padding: 2px 0 6px; width: 100%; }
  .cal-dow.sun { color: var(--owed); }
  .cal-dow.sat { color: #2B6CB0; }
  .cal-day {
    aspect-ratio: 1; width: 100%; max-width: 44px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 12px; cursor: pointer; position: relative; font-size: 14px; font-weight: 500;
    transition: background .12s, color .12s; user-select: none;
  }
  .cal-day span { line-height: 1; display: inline-block; }
  .cal-day:hover { background: #F1F3F6; }
  .cal-day.today { font-weight: 700; }
  .cal-day.today::before {
    content: ''; position: absolute; top: 4px; right: 4px; width: 4px; height: 4px;
    border-radius: 50%; background: var(--done);
  }
  .cal-day.selected { background: var(--ink) !important; color: #fff !important; font-weight: 700; }
  .cal-day.empty-day { cursor: default; pointer-events: none; }
  .cal-dots { display: flex; gap: 2px; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-dot.owed { background: var(--owed); }
  .cal-dot.done { background: var(--done); }
  .cal-day.selected .cal-dot.owed { background: #FF9EBB; }
  .cal-day.selected .cal-dot.done { background: #7CE0D3; }

  /* 設定画面スタイル */
  .menu-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; cursor: pointer; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px;
    transition: transform .1s, background .15s;
  }
  .menu-card:active { transform: scale(0.99); }
  .menu-info b { display: block; font-size: 16px; font-weight: 700; color: var(--ink); }
  .menu-info span { font-size: 12px; color: var(--sub); margin-top: 2px; display: block; }
  .menu-arrow { font-size: 18px; color: var(--sub); font-weight: 700; }

  .theme-box {
    flex: 1; border: 2px solid var(--line); border-radius: 14px; padding: 14px;
    cursor: pointer; text-align: center; background: var(--card); color: var(--ink);
    transition: border-color .15s;
  }
  .theme-box.on { border-color: var(--ink); font-weight: 700; background: var(--owed-soft); color: var(--ink); }
  .font-pick {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
    margin-top: 8px; cursor: pointer; background: var(--card); color: var(--ink);
  }
  .font-pick.on { border-color: var(--ink); background: var(--owed-soft); font-weight: 700; }

  /* ダークモード適応 */
  [data-theme="dark"] nav { background: rgba(30, 41, 59, 0.94); border-color: rgba(51, 65, 85, 0.8); }
  [data-theme="dark"] nav button.on { background: #334155; color: #F8FAFC; }
  [data-theme="dark"] input[type=text], [data-theme="dark"] input[type=password], [data-theme="dark"] input[type=number], [data-theme="dark"] input[type=date], [data-theme="dark"] select { background: #0F172A; border-color: #334155; color: #F8FAFC; }
  [data-theme="dark"] .pick, [data-theme="dark"] .filter-box, [data-theme="dark"] .btn, [data-theme="dark"] .ghost { background: #1E293B; border-color: #334155; color: #F8FAFC; }
  [data-theme="dark"] .pick.on, [data-theme="dark"] .filter-box.on, [data-theme="dark"] .btn.on { background: #F8FAFC; border-color: #F8FAFC; color: #0F172A; }
  [data-theme="dark"] .primary { background: #F8FAFC; color: #0F172A; }
  [data-theme="dark"] .cal-nav-btn { background: #0F172A; border-color: #334155; color: #F8FAFC; }
  [data-theme="dark"] .cal-day:hover { background: #334155; }
  [data-theme="dark"] .cal-day.selected { background: #F8FAFC !important; color: #0F172A !important; }
  [data-theme="dark"] .grp { background: #0F172A; border-color: #334155; }
  [data-theme="dark"] .theme-box.on, [data-theme="dark"] .font-pick.on { background: #334155; border-color: #F8FAFC; color: #F8FAFC; }
  [data-theme="dark"] .cal-card, [data-theme="dark"] .summary-card { background: #1E293B; border-color: #334155; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
  .stack > .card { margin-bottom: 10px; }

  /* 立替一覧 */
  .adv { padding: 15px 18px; }
  .adv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .adv-title { font-weight: 700; }
  .adv-meta { font-size: 12px; color: var(--sub); margin-top: 1px; }
  .state { flex-shrink: 0; font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 9px; background: var(--owed-soft); color: var(--owed); }
  .state.done { background: var(--done-soft); color: var(--done); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip { border: 1px solid #EBC9D6; background: var(--owed-soft); color: var(--owed); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.paid { border-color: #C7E3DF; background: var(--done-soft); color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
  .link { background: none; border: none; color: var(--sub); font: inherit; font-size: 13px; cursor: pointer; padding: 6px 0 0; }

  /* 属性バッジ */
  .tag { font-size: 11px; color: var(--sub); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px; }

  /* フォーム部品 */
  .pad { padding: 18px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 16px 0 6px; }
  .pad > label:first-child { margin-top: 0; }
  input[type=text], input[type=password], input[type=number], input[type=date], select {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: 11px; background: #FAFBFC; color: var(--ink);
  }
  input[type=date] { text-align: center; -webkit-appearance: none; }
  input[type=date]::-webkit-date-and-time-value { text-align: center; }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%); background-position: calc(100% - 19px) 21px, calc(100% - 13px) 21px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
  input:focus { background: #fff; border-color: var(--ink); outline: none; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick { border: 1px solid var(--line); background: #fff; border-radius: 11px; padding: 9px 14px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  .pick.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .pick.add { border-style: dashed; color: var(--sub); }
  .pick.more { border-color: var(--line); background: #EDF0F3; color: var(--sub); font-weight: 700; }
  .filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 10px; }
  .filter-box { border: 1px solid var(--line); background: #fff; border-radius: 11px; padding: 9px 2px; font: inherit; font-size: 13px; font-weight: 700; text-align: center; cursor: pointer; color: var(--ink); }
  .filter-box.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg { display: flex; background: #EDF0F3; border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; border: none; background: none; font: inherit; font-size: 14px; padding: 9px 0; border-radius: 9px; color: var(--sub); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { font-weight: 500; }
  .row input { width: 118px; text-align: right; }
  .grp { background: #FAFBFC; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
  .grp .head { display: flex; align-items: center; gap: 10px; }
  .grp .head b { flex: 1; font-size: 14px; font-weight: 700; }
  .grp .head input { width: 118px; text-align: right; }
  .grp .who { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .check { display: flex; align-items: center; gap: 9px; margin-top: 14px; font-size: 14px; }
  .check input { width: 19px; height: 19px; accent-color: var(--ink); }
  .sum { font-size: 13px; color: var(--sub); margin-top: 12px; }
  .sum b { color: var(--ink); }
  .primary { width: 100%; margin-top: 18px; padding: 14px; border: none; border-radius: 13px; background: var(--ink); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
  .ghost { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; margin-top: 12px; }
  .ghost.accent { border-color: #C7E3DF; background: var(--done-soft); color: var(--done); font-weight: 700; }
  .ghost.danger { color: var(--owed); border-color: #EBC9D6; }
  .inline { display: flex; gap: 8px; }
  .inline .primary { margin-top: 0; width: auto; padding: 11px 18px; font-size: 15px; }
  .empty { color: var(--sub); text-align: center; padding: 34px 16px; font-size: 14px; line-height: 1.9; }
  .note { font-size: 12px; color: var(--sub); margin: 12px 6px 0; }

  /* ログイン画面のエラー表示 */
  .auth-error { background: var(--owed-soft); color: var(--owed); border: 1px solid #EBC9D6;
                border-radius: 11px; padding: 12px 14px; font-size: 13px; margin-top: 16px; line-height: 1.75; }
  .primary[disabled], .ghost[disabled] { opacity: .55; cursor: default; }

  /* 操作ボタン（一覧の編集・削除、均等で割る など） */
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 9px 16px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.danger { border-color: #EBC9D6; background: var(--owed-soft); color: var(--owed); }
  .acts { display: flex; gap: 8px; margin-top: 14px; }

  /* メンバー並べ替えのつまみ */
  .handle { cursor: grab; color: var(--sub); font-size: 17px; line-height: 1; padding: 6px 8px; margin-left: -4px; touch-action: none; user-select: none; }
  .card.dragging { position: relative; z-index: 5; pointer-events: none; box-shadow: 0 10px 26px rgba(16,32,46,.20); }

  nav {
    position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    max-width: 532px; margin: 0 auto; display: flex;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(228, 232, 236, 0.9); border-radius: 26px;
    box-shadow: 0 10px 30px rgba(16,32,46,.12), 0 2px 6px rgba(16,32,46,.04);
    z-index: 10; padding: 6px; gap: 4px;
  }
  nav button {
    flex: 1; border: none; background: none; font: inherit; font-size: 13px;
    padding: 12px 0; color: var(--sub); cursor: pointer; border-radius: 20px;
    transition: background .15s, color .15s; font-weight: 500;
  }
  nav button.on { color: var(--ink); font-weight: 700; background: #EDF0F3; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--done); outline-offset: 2px; }

  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 88px); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86%; text-align: center; z-index: 20; }
  #toast.show { opacity: 1; }
  /* 保存中だけ右上でくるくる回る小さな印 */
  #loading { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(16,32,46,.13); border-top-color: var(--done); animation: spin .7s linear infinite; display: none; z-index: 9; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #loading { animation: none; } .caret { transition: none; }
    .card[data-member] { transition: none !important; }
  }
</style>
</head>
<body>
<div id="loading"></div>
<main id="view"></main>
<nav>
  <button data-tab="owed" class="on">未回収</button>
  <button data-tab="list">立替一覧</button>
  <button data-tab="add">＋登録</button>
  <button data-tab="settings">設定</button>
</nav>
<div id="toast"></div>

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  // 長い案内文は読み切れるように表示時間を延ばす
  toastTimer = setTimeout(() => t.classList.remove('show'), msg.length > 30 ? 6000 : 2200);
}

function spin(on) {
  const el = document.getElementById('loading');
  if (el) el.style.display = on ? 'block' : 'none';
}

// ---------- サーバーとのやりとり ----------
// GitHub Pages に置いた画面から呼ぶので、google.script.run ではなく fetch を使う。
// Content-Type を text/plain にしているのは、ブラウザの事前問い合わせ（preflight）を
// 発生させないため。これがないと Apps Script 側が応答できない。
function post_(body) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  }).then(r => r.text().then(text => {
    // Apps Script は、設定が合っていないと JSON ではなく Google のHTMLページを返す。
    // そのまま .json() すると意味の分からないエラーになるので、ここで原因を言い当てる。
    try {
      return JSON.parse(text);
    } catch (_) {
      console.error('サーバーの応答がJSONではありません', r.status, text.slice(0, 500));
      const hint = (r.status === 404 || /ページが見つかりません|not found/i.test(text))
        ? 'Apps Script 側がまだ更新されていない可能性があります（clasp push と再デプロイが必要）。'
        : 'ウェブアプリの公開設定が「全員」になっているか確認してください。';
      throw new Error('サーバーが正しく応答しませんでした（' + r.status + '）。' + hint);
    }
  }));
}

function rpc(fn, args) {
  return post_({ action: fn, args: args || [], token: TOKEN }).then(j => {
    if (!j.ok) throw new Error(j.error || '通信に失敗しました');
    return j.data;
  });
}

// ログインが切れたことを表すエラーかどうか
const isAuthError = err => /ログイン/.test((err && err.message) ? err.message : '');

// 結果を待ってから画面を作るもの（最初の読み込み、エラーからの復帰）
function call(fn, args, doneMsg, after) {
  spin(true);
  // 10秒返事がなければ「固まっている」ことを画面に出す（原因切り分け用）
  const watchdog = setTimeout(() => toast(fn + ' からの応答がありません（10秒）'), 10000);
  rpc(fn, args)
    .then(data => {
      clearTimeout(watchdog);
      spin(false);
      DATA = data;
      if (after) after();
      render();
      if (doneMsg) toast(doneMsg);
    })
    .catch(err => {
      clearTimeout(watchdog);
      spin(false);
      console.error(fn + ' failed:', err);
      if (isAuthError(err)) { signOut(true); return; }
      toast((err && err.message) ? err.message : String(err));
    });
}

// ---------- 保存待ちの行列 ----------
// 手元のデータを先に書き換えて即座に描き直し、スプレッドシートへの保存は裏で順に流す
let queue = [];      // 保存待ちの処理
let sending = false; // いま送信中かどうか

function save(localChange, fn, args, doneMsg) {
  localChange();              // 1. 手元のデータをすぐ書き換える
  render();                   // 2. すぐ画面に出す（待たせない）
  if (doneMsg) toast(doneMsg);
  queue.push({ fn, args });   // 3. 保存は行列に並べる
  drain();
}

function drain() {
  if (sending || !queue.length) return;
  sending = true; spin(true);
  const job = queue[0];
  rpc(job.fn, job.args)
    .then(data => {
      queue.shift(); sending = false;
      // 行列が空になった時だけ、サーバーの内容に揃え直す（IDの確定など）
      if (!queue.length) { spin(false); DATA = data; render(); }
      drain();
    })
    .catch(err => {
      console.error('保存に失敗:', job.fn, err);
      queue = []; sending = false; spin(false);
      if (isAuthError(err)) { signOut(true); return; }
      toast('保存できませんでした：' + ((err && err.message) ? err.message : String(err)));
      call('getData', []);   // 画面をサーバーの状態に戻す
    });
}

// ---------- ログイン・登録・ログアウト ----------
function authSubmit_(action, body, okMsg) {
  if (authBusy) return;
  authBusy = true; authError = '';
  render();          // ボタンを「送信中…」に変えて、押したことが目に見えるようにする
  spin(true);
  post_(Object.assign({ action: action }, body))
    .then(j => {
      authBusy = false;
      if (!j.ok) {
        spin(false);
        authError = j.error || 'うまくいきませんでした';
        render();    // エラーは消さずに画面に残す
        return;
      }
      TOKEN = j.data.token;
      ME = j.data.profile;
      try { localStorage.setItem('wn_token', TOKEN); } catch (_) {}
      authForm = { name: '', email: '', pass: '', invite: '' };
      TAB = 'owed';
      call('getData', [], okMsg);
    })
    .catch(err => {
      authBusy = false; spin(false);
      console.error(action + ' failed:', err);
      authError = (err && err.message) ? err.message : 'サーバーに接続できませんでした';
      render();
    });
}

function authFail_(msg) { authError = msg; render(); }

function doLogin() {
  const email = (authForm.email || '').trim();
  const pass = authForm.pass || '';
  if (!email || !pass) { authFail_('メールアドレスとパスワードを入力してください'); return; }
  authSubmit_('login', { email: email, password: pass }, 'ログインしました');
}

function doSignup() {
  const name = (authForm.name || '').trim();
  const email = (authForm.email || '').trim();
  const pass = authForm.pass || '';
  const invite = (authForm.invite || '').trim();
  if (!name)   { authFail_('名前を入力してください'); return; }
  if (!email)  { authFail_('メールアドレスを入力してください'); return; }
  if (!invite) { authFail_('招待コードを入力してください'); return; }
  if (pass.length < 8) { authFail_('パスワードは8文字以上にしてください（いまは' + pass.length + '文字です）'); return; }
  authSubmit_('signup', { name: name, email: email, password: pass, invite: invite },
              'ようこそ、' + name + 'さん');
}

function signOut(expired) {
  const old = TOKEN;
  TOKEN = ''; ME = null;
  DATA = { members: [], advances: [] };
  queue = []; sending = false;
  form = null; editing = null;
  try { localStorage.removeItem('wn_token'); } catch (_) {}
  authView = 'login';
  spin(false);
  render();
  toast(expired ? 'ログインの期限が切れました。もう一度ログインしてください' : 'ログアウトしました');
  // サーバー側の合鍵も無効にする（失敗しても画面上は問題ない）
  if (old) post_({ action: 'logout', token: old }).catch(() => {});
}

function newForm() {

           filters: [], showAllPool: false, showGroup: false, includeMe: true, groupAmt: {}, amounts: {}, adding: null };
}
// 既存の立替を、登録フォームに読み込んで編集状態にする
function formFromAdvance(a) {
  const f = newForm();
  f.id = a.id; f.date = a.date; f.title = a.title; f.total = a.total; f.memo = a.memo;
  f.picked = a.shares.map(s => s.person);
  a.shares.forEach(s => f.amounts[s.person] = s.amount);
  f.includeMe = a.headcount > a.shares.length;
  return f;
}

// ---------- 集計 ----------
function owedByPerson() {
  const map = {};
  DATA.advances.forEach(a => a.shares.forEach(s => {
    if (s.paid) return;
    if (!map[s.person]) map[s.person] = { total: 0, items: [] };
    map[s.person].total += s.amount;
    map[s.person].items.push({ share: s, adv: a });
  }));
  return Object.entries(map).sort((x, y) => y[1].total - x[1].total);
}
const pickedSum = () => form.picked.reduce((x, p) => x + (Number(form.amounts[p]) || 0), 0);

function renderOwed() {

  const hero = `
    <div class="summary-card">
      <div class="head">
        <span class="title">まだ返ってきていないお金</span>
        <span class="state ${grand === 0 ? 'done' : ''}">${owed.length ? owed.length + '人から回収予定' : '精算完了'}</span>
      </div>
      <div class="amt">${yen(grand)}</div>
      <div class="sub-stats">
        <span>未回収 ${unpaidCount}件</span>
        <span>回収済み ${paidCount}件</span>
      </div>
    </div>`;

  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const firstDow = new Date(calYear, calMonth - 1, 1).getDay(); // 0: Sun
  const nowStr = today();
  const isCurMonth = (calYear === Number(nowStr.slice(0, 4)) && calMonth === Number(nowStr.slice(5, 7)));

  let gridHtml = '';
  for (let i = 0; i < firstDow; i++) {
    gridHtml += '<div class="cal-day empty-day"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = String(d).padStart(2, '0');
    const mStr = String(calMonth).padStart(2, '0');
    const dateStr = `${calYear}-${mStr}-${dStr}`;
    const isToday = (dateStr === nowStr);
    const isSel = (dateStr === selectedDate);
    const advs = DATA.advances.filter(a => a.date === dateStr);

    let dotHtml = '';
    if (advs.length > 0) {
      const hasUnpaid = advs.some(a => a.shares.some(s => !s.paid));
      dotHtml = `<div class="cal-dots"><span class="cal-dot ${hasUnpaid ? 'owed' : 'done'}"></span></div>`;
    }

    gridHtml += `
      <div class="cal-day ${isSel ? 'selected' : ''} ${isToday ? 'today' : ''}" data-act="cal-select" data-date="${dateStr}">
        <span>${d}</span>
        ${dotHtml}
      </div>`;
  }

  const calHtml = `
    <div class="cal-card">
      <div class="cal-header">
        <div class="cal-title">${calYear}年 ${calMonth}月</div>
        <div class="cal-nav">
          ${!isCurMonth ? '<button type="button" class="btn" data-act="cal-today" style="padding:4px 8px; font-size:11px;">今月</button>' : ''}
          <button type="button" class="cal-nav-btn" data-act="cal-prev" title="前月">◀</button>
          <button type="button" class="cal-nav-btn" data-act="cal-next" title="翌月">▶</button>
        </div>
      </div>
      <div class="cal-grid">
        <div class="cal-dow sun">日</div>
        <div class="cal-dow">月</div>
        <div class="cal-dow">火</div>
        <div class="cal-dow">水</div>
        <div class="cal-dow">木</div>
        <div class="cal-dow">金</div>
        <div class="cal-dow sat">土</div>
        ${gridHtml}
      </div>
    </div>`;

  const selAdvs = DATA.advances.filter(a => a.date === selectedDate);
  const selD = new Date(selectedDate + 'T00:00:00');
  const dows = ['日', '月', '火', '水', '木', '金', '土'];
  const dowName = dows[selD.getDay()] || '';
  const dateFormatted = `${Number(selectedDate.slice(5, 7))}月${Number(selectedDate.slice(8, 10))}日(${dowName})`;

  const detailHeader = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin:20px 4px 10px;">
      <h2 style="margin:0; font-size:15px; font-weight:700; color:var(--ink);">${dateFormatted} の立替</h2>
      <button type="button" class="btn on" data-act="cal-add" data-date="${selectedDate}" style="padding:7px 13px; font-size:12px;">＋ この日に登録</button>
    </div>`;

  let detailBody = '';
  if (selAdvs.length > 0) {
    detailBody = '<div class="stack">' + selAdvs.map(a => {
      const done = a.shares.every(s => s.paid);
      const rest = a.shares.filter(s => !s.paid).reduce((x, s) => x + s.amount, 0);
      return `
      <div class="card adv" style="cursor:pointer;" data-act="cal-edit" data-id="${a.id}">
        <div class="adv-top">
          <div>

  } else {

  return hero + calHtml + detailHeader + detailBody;

// 均等割り（端数は切り上げ）。「均等で割る」ボタンを押した時だけ走る
function autoEven() {
  const total = Number(form.total) || 0;
  if (!total) { toast('先に「支払った総額」を入れてください'); return; }
  const n = form.picked.length + (form.includeMe ? 1 : 0);
  const each = n ? Math.ceil(total / n) : 0;
  form.picked.forEach(p => form.amounts[p] = each);
  render();
}
// 属性ごとの金額を、その属性の人全員に反映
function applyGroup(g) {
  const v = Number(form.groupAmt[g]) || 0;
  form.picked.filter(p => groupOf(p) === g).forEach(p => form.amounts[p] = v);
}

function sumText(sum, total) {
  const t = Number(total) || 0;
  if (!t) return `回収予定 <b>${yen(sum)}</b>`;   // 総額が空欄なら自分の負担は出さない
  const diff = t - sum;
  const self = diff >= 0 ? `自分の負担 <b>${yen(diff)}</b>` : `総額より <b>${yen(-diff)}</b> 多い`;
  return `回収予定 <b>${yen(sum)}</b>　／　${self}`;
}
function updateSummary() {
  const el = document.getElementById('f-sum');
  if (el) el.innerHTML = sumText(pickedSum(), form.total);
}
function refreshAmounts() {
  document.querySelectorAll('[data-amt]').forEach(i => i.value = form.amounts[i.dataset.amt] ?? '');
}

// ---------- 入力 ----------
document.addEventListener('input', e => {
  const t = e.target;
  if (editing && t.id === 'e-name') editing.name = t.value;
  if (t.id === 'a-name')   authForm.name = t.value;
  if (t.id === 'a-email')  authForm.email = t.value;
  if (t.id === 'a-pass')   authForm.pass = t.value;
  if (t.id === 'a-invite') authForm.invite = t.value;
  if (!form) return;
  if (t.id === 'f-date') form.date = t.value;
  if (t.id === 'f-title') form.title = t.value;
  if (t.id === 'f-memo') form.memo = t.value;
  if (t.id === 'n-name') form.adding.name = t.value;
  if (t.id === 'f-total') { form.total = t.value; updateSummary(); }
  if (t.dataset.grp) {
    form.groupAmt[t.dataset.grp] = t.value;
    applyGroup(t.dataset.grp);
    refreshAmounts(); updateSummary();
  }
  if (t.dataset.amt) { form.amounts[t.dataset.amt] = t.value; updateSummary(); }
});

document.addEventListener('change', e => {
  if (!form) return;
  if (e.target.id === 'f-me') { form.includeMe = e.target.checked; render(); }
});

document.addEventListener('click', e => {
  const tab = e.target.closest('nav button');
  if (tab) {
    TAB = tab.dataset.tab; editing = null;
    if (TAB === 'add' && form && form.id) form = null;   // 編集中に＋登録を押したら新規入力に戻す
    if (TAB === 'settings') settingsView = 'menu';
    render(); scrollTop(); return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {

    // ログイン画面
    case 'auth-toggle':
      if (authBusy) break;
      authView = authView === 'signup' ? 'login' : 'signup';
      authError = ''; render(); break;
    case 'do-login':
      doLogin(); break;
    case 'do-signup':
      doSignup(); break;
    case 'do-logout':
      if (confirm('ログアウトしますか？')) signOut(false);
      break;

    // 設定
    case 'set-nav':
      settingsView = d.to;
      render(); scrollTop(); break;
    case 'set-back':
      settingsView = 'menu';
      render(); scrollTop(); break;
    case 'set-theme':
      try { localStorage.setItem('flair_theme', d.v); } catch (_) {}
      document.documentElement.dataset.theme = d.v;
      render(); break;
    case 'set-font':
      try { localStorage.setItem('flair_font', d.v); } catch (_) {}
      document.documentElement.dataset.font = d.v;
      render(); break;

    // カレンダー
    case 'cal-prev':
      calMonth--;
      if (calMonth < 1) { calMonth = 12; calYear--; }
      render(); break;
    case 'cal-next':
      calMonth++;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      render(); break;
    case 'cal-today': {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth() + 1;
      selectedDate = today();
      render(); break;
    }
    case 'cal-select':
      selectedDate = d.date;
      render(); break;
    case 'cal-add':
      form = newForm();
      form.date = d.date || selectedDate;
      TAB = 'add';
      render(); scrollTop(); break;
    case 'cal-edit': {
      const a = DATA.advances.find(x => x.id === d.id);
      if (a) { form = formFromAdvance(a); TAB = 'add'; render(); scrollTop(); }
      break;
    }

    // 未回収（互換用）
    case 'toggle':
      openPeople.has(d.name) ? openPeople.delete(d.name) : openPeople.add(d.name);
      render(); break;
    case 'payall': {
      if (!confirm(`${d.name}から全額受け取った扱いにしますか？`)) break;
      const ids = d.ids.split(',');
      save(() => DATA.advances.forEach(a => a.shares.forEach(s => {
        if (ids.includes(s.id)) { s.paid = true; s.paidDate = today(); }
      })), 'setPaid', [ids, true], `${d.name}の分を回収済みにしました`);
      break;
    }

    // 立替一覧
    case 'flip': {
      const paid = d.paid !== 'true';
      save(() => DATA.advances.forEach(a => a.shares.forEach(s => {
        if (s.id === d.id) { s.paid = paid; s.paidDate = paid ? today() : ''; }
      })), 'setPaid', [[d.id], paid], paid ? '回収済みにしました' : '未回収に戻しました');
      break;
    }
    case 'copy': {
      const a = DATA.advances.find(x => x.id === d.id);
      if (a) {
        form = formFromAdvance(a);
        form.id = null;
        TAB = 'add';
        render();
        scrollTop();
        toast('立替内容をコピーしました。日付や金額を調整して登録してください');
      }
      break;
    }
    case 'form-copy': {
      if (!form) break;
      form.id = null;
      render();
      scrollTop();
      toast('新規作成に切り替えました。日付や金額を調整して登録してください');
      break;
    }
    case 'edit': {
      const a = DATA.advances.find(x => x.id === d.id);
      if (a) { form = formFromAdvance(a); TAB = 'add'; render(); scrollTop(); }
      break;
    }
    case 'edit-cancel':
      form = null; TAB = 'list'; render(); break;
    case 'delete':
      if (confirm(`「${d.title}」を削除しますか？`))
        save(() => { DATA.advances = DATA.advances.filter(a => a.id !== d.id); },
             'deleteAdvance', [d.id], '削除しました');
      break;

    // 登録フォーム
    case 'f-box': {
      const v = d.v;
      if (!form.filters) form.filters = [];
      if (form.filters.includes(v)) {
        form.filters = form.filters.filter(x => x !== v);
      } else {
        if (STATUSES.includes(v)) form.filters = form.filters.filter(x => !STATUSES.includes(x));
        if (GENDERS.includes(v)) form.filters = form.filters.filter(x => !GENDERS.includes(x));
        form.filters.push(v);
      }
      form.showAllPool = false;
      render(); break;
    }
    case 'pool-toggle':
      form.showAllPool = !form.showAllPool;
      render(); break;
    case 'pick':
      form.picked = form.picked.includes(d.name) ? form.picked.filter(x => x !== d.name) : [...form.picked, d.name];
      if (form.showGroup) applyGroup(groupOf(d.name));   // 金額は自動で入れない（空のまま）
      render(); break;
    case 'even':
      autoEven(); break;
    case 'group-toggle':
      form.showGroup = !form.showGroup; render(); break;
    case 'n-open':
      form.adding = { name: '', status: '', gender: '' }; render(); break;
    case 'n-cancel':
      form.adding = null; render(); break;
    case 'n-status':
      form.adding.status = form.adding.status === d.v ? '' : d.v; render(); break;
    case 'n-gender':
      form.adding.gender = form.adding.gender === d.v ? '' : d.v; render(); break;
    case 'n-save': {
      const m = { ...form.adding, name: (document.getElementById('n-name').value || '').trim() };
      if (!m.name) { toast('名前を入力してください'); break; }
      if (DATA.members.some(x => x.name === m.name)) { toast(m.name + ' はすでに登録されています'); break; }
      save(() => {
        DATA.members.push({ name: m.name, status: m.status || '', gender: m.gender || '' });
        form.adding = null;
        if (!form.picked.includes(m.name)) form.picked.push(m.name);
        if (form.showGroup) applyGroup(groupOf(m.name));
      }, 'addMember', [m], `${m.name}を追加しました`);
      break;
    }
    case 'save': {
      const shares = form.picked.map(p => ({ person: p, amount: Number(form.amounts[p]) || 0 })).filter(s => s.amount > 0);
      const payload = {
        id: form.id,
        date: form.date, title: (form.title || '').trim(),
        total: form.total === '' ? '' : Number(form.total),   // 空欄のまま登録できる
        headcount: form.picked.length + (form.includeMe ? 1 : 0),
        memo: (form.memo || '').trim(), shares,
      };
      if (!payload.title) { toast('内容を入力してください'); break; }
      if (!shares.length) { toast('回収する相手と金額を入力してください'); break; }
      const isEdit = !!form.id;
      save(() => {
        if (isEdit) {
          const a = DATA.advances.find(x => x.id === payload.id);
          if (a) {
            const was = {};
            a.shares.forEach(x => was[x.person] = x);   // 回収済みの状態を引き継ぐ
            a.date = payload.date; a.title = payload.title; a.total = payload.total;
            a.headcount = payload.headcount; a.memo = payload.memo;
            a.shares = shares.map(x => was[x.person]
              ? { ...was[x.person], amount: x.amount }
              : { id: tmpId(), advanceId: a.id, person: x.person, amount: x.amount, paid: false, paidDate: '' });
          }
        } else {
          const id = tmpId();
          DATA.advances.push({
            id, date: payload.date, title: payload.title, total: payload.total,
            headcount: payload.headcount, memo: payload.memo,
            shares: shares.map(x => ({ id: tmpId(), advanceId: id, person: x.person, amount: x.amount, paid: false, paidDate: '' })),
          });
        }
        sortAdvances();
        selectedDate = payload.date;
        calYear = Number(payload.date.slice(0, 4));
        calMonth = Number(payload.date.slice(5, 7));
        form = null; TAB = isEdit ? 'list' : 'owed';
      }, isEdit ? 'updateAdvance' : 'addAdvance', [payload], isEdit ? '保存しました' : '登録しました');
      break;
    }

    // メンバー
    case 'm-toggle':
      showAllMembers = !showAllMembers;
      render(); break;
    case 'm-add': {
      const name = (document.getElementById('m-name').value || '').trim();
      if (!name) { toast('名前を入力してください'); break; }
      if (DATA.members.some(x => x.name === name)) { toast(name + ' はすでに登録されています'); break; }
      save(() => DATA.members.push({ name, status: '', gender: '' }),
           'addMember', [{ name, status: '', gender: '' }], `${name}を追加しました`);
      break;
    }
    case 'm-edit': {
      showAllMembers = true;
      const m = member(d.name);
      editing = { oldName: m.name, name: m.name, status: m.status, gender: m.gender };
      render(); break;
    }
    case 'e-status':
      editing.status = editing.status === d.v ? '' : d.v; render(); break;
    case 'e-gender':
      editing.gender = editing.gender === d.v ? '' : d.v; render(); break;
    case 'e-cancel':
      editing = null; render(); break;
    case 'e-save': {
      const payload = { ...editing, name: (document.getElementById('e-name').value || '').trim() };
      if (!payload.name) { toast('名前を入力してください'); break; }
      save(() => {
        const mm = DATA.members.find(x => x.name === payload.oldName);
        if (mm) { mm.name = payload.name; mm.status = payload.status || ''; mm.gender = payload.gender || ''; }
        if (payload.name !== payload.oldName) {
          DATA.advances.forEach(a => a.shares.forEach(x => { if (x.person === payload.oldName) x.person = payload.name; }));
        }
        editing = null;
      }, 'updateMember', [payload], '保存しました');
      break;
    }
    case 'e-delete':
      if (confirm(`${d.name}をメンバーから削除しますか？\n過去の立替の記録はそのまま残ります。`))
        save(() => { DATA.members = DATA.members.filter(x => x.name !== d.name); editing = null; },
             'deleteMember', [d.name], '削除しました');
      break;
  }
});

// ---------- メンバーの並べ替え（☰ をつかんで上下にドラッグ） ----------
// マウスでも指でも同じように動くよう Pointer イベントを使う
let dragEl = null;   // つかんでいるカード
let startY = 0;      // つかんだ瞬間の指の位置
let baseY = 0;       // 並びが入れ替わったぶんのズレ

// 入れ替えた行を、元いた場所から新しい場所へすべらせる（FLIP という定番の手法）
function slideRows(list, move) {
  const rows = [...list.querySelectorAll('[data-member]')];
  const before = rows.map(r => r.getBoundingClientRect().top);   // 1. 動かす前の位置を覚える
  move();                                                        // 2. 入れ替える
  rows.forEach((r, i) => {
    if (r === dragEl) return;                                    // つかんでいる本人は指について回る
    const dy = before[i] - r.getBoundingClientRect().top;
    if (!dy) return;
    r.style.transition = 'none';                                 // 3. いったん元の位置に見せて…
    r.style.transform = 'translateY(' + dy + 'px)';
    requestAnimationFrame(() => {                                // 4. そこから新しい位置へ滑らせる
      r.style.transition = 'transform .18s cubic-bezier(.2,.7,.3,1)';
      r.style.transform = '';
    });
  });
}

document.addEventListener('pointerdown', e => {
  if (editing) return;                       // 編集中は並べ替えしない
  const h = e.target.closest('.handle');
  if (!h) return;
  const row = h.closest('[data-member]');
  if (!row) return;
  e.preventDefault();
  dragEl = row; startY = e.clientY; baseY = 0;
  row.classList.add('dragging');
  row.style.transition = 'none';
  h.setPointerCapture(e.pointerId);
});

document.addEventListener('pointermove', e => {
  if (!dragEl) return;
  e.preventDefault();
  const list = document.getElementById('m-list');
  if (!list) return;

  // つかんだカードは指にぴったりついてくる
  dragEl.style.transform = 'translateY(' + (e.clientY - startY - baseY) + 'px)';

  // 画面の端に寄せたら少しずつスクロールする
  const view = document.getElementById('view');
  if (view) {
    const vb = view.getBoundingClientRect();
    if (e.clientY < vb.top + 60) view.scrollTop -= 10;
    else if (e.clientY > vb.bottom - 60) view.scrollTop += 10;
  }

  const under = document.elementFromPoint(e.clientX, e.clientY);
  const target = under && under.closest('[data-member]');
  if (!target || target === dragEl || target.parentNode !== list) return;
  const box = target.getBoundingClientRect();
  const below = e.clientY > box.top + box.height / 2;

  const t0 = dragEl.getBoundingClientRect().top;
  slideRows(list, () => list.insertBefore(dragEl, below ? target.nextSibling : target));
  baseY += dragEl.getBoundingClientRect().top - t0;      // 入れ替わったぶんを打ち消す
  dragEl.style.transform = 'translateY(' + (e.clientY - startY - baseY) + 'px)';
});

function endDrag(commit) {
  if (!dragEl) return;
  const el = dragEl; dragEl = null;
  const list = document.getElementById('m-list');
  const names = list ? [...list.querySelectorAll('[data-member]')].map(x => x.dataset.member) : [];

  el.style.transition = 'transform .16s ease';   // 空いた場所へすとんと収まる
  el.style.transform = '';
  setTimeout(() => {
    el.classList.remove('dragging');
    el.style.transition = ''; el.style.transform = '';
    if (!commit || !list) return;
    if (names.length !== DATA.members.length) return;      // 表示が欠けている時は保存しない
    if (names.join('\n') === DATA.members.map(m => m.name).join('\n')) return;   // 変化なし
    save(() => {
      const by = {};
      DATA.members.forEach(m => by[m.name] = m);
      DATA.members = names.map(x => by[x]).filter(Boolean);
    }, 'reorderMembers', [names], '');
  }, 170);
}
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));

// 起動：まずログイン画面を出し、前回の合鍵が残っていれば自動で入り直す
render();
if (TOKEN) {
  spin(true);
  rpc('me', [])
    .then(prof => { ME = prof; spin(false); call('getData', []); })
    .catch(() => {
      spin(false);
      TOKEN = '';
      try { localStorage.removeItem('wn_token'); } catch (_) {}
      render();
    });
}
</script>
